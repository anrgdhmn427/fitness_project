spring:
  application:
    name: USER-SERVICE

  datasource:
     url: jdbc:postgresql://localhost:5432/fitness_user_db
     username: postgres
     password: root

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

server:
  port: 8081
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/



logging:
  level:
    org:
      springframework:
        cloud:
          loadbalancer=DEBUG: